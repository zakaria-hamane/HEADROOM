<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Headroom: know your GPU headroom before you buy, for the whole agentic RAG stack</title>
  <desc id="d">GPU planner for agentic RAG. Example result: Llama 3.3 70B in FP8 for 32 users at 16K context, with Whisper, BGE-M3, a reranker, OCR and text-to-speech on the same 4 H100 GPUs, fits at 63% of usable memory: 34.9 tokens per second per user, 1.56 s from question to first word.</desc>
  <defs>
    <linearGradient id="brand" x1="6" y1="4" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6BFF"/>
      <stop offset=".52" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF7E51"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".44" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#38C9E0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 -40) rotate(30) scale(720 420)">
      <stop stop-color="#2F6BFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 520) rotate(200) scale(620 380)">
      <stop stop-color="#FF7E51" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FF7E51" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#323A6A" fill-opacity=".55"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="480" rx="28"/></clipPath>
    <style>
      .disp { font-family: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .sans { font-family: 'IBM Plex Sans', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      .grow { transform-box: fill-box; transform-origin: left center; animation: grow 9s cubic-bezier(.2,.8,.2,1) infinite both; }
      .g1 { animation-delay: .2s } .g2 { animation-delay: .45s } .g3 { animation-delay: .7s } .g4 { animation-delay: .85s } .g5 { animation-delay: 1s } .g6 { animation-delay: 1.15s }
      @keyframes grow { 0% { transform: scaleX(0) } 14% { transform: scaleX(1) } 88% { transform: scaleX(1) } 96%, 100% { transform: scaleX(0) } }
      .lift { animation: lift 2.6s ease-in-out infinite; }
      @keyframes lift { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
      .rise { animation: rise 9s ease-out infinite both; }
      .r1 { animation-delay: .9s } .r2 { animation-delay: 1.1s } .r3 { animation-delay: 1.3s } .r4 { animation-delay: .3s }
      @keyframes rise { 0% { opacity: 0; transform: translateY(8px) } 10%, 88% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { .grow, .lift, .rise, .pulse { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="#080A15"/>
    <rect width="1280" height="480" fill="url(#dots)"/>
    <rect width="1280" height="480" fill="url(#glowA)"/>
    <rect width="1280" height="480" fill="url(#glowB)"/>

    <!-- logo -->
    <g transform="translate(64 64) scale(1.375)">
      <rect width="64" height="64" rx="16" fill="url(#brand)"/>
      <g stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="13" width="32" height="38" rx="7"/>
        <path d="M10 24h6M10 32h6M10 40h6M48 24h6M48 32h6M48 40h6"/>
        <path class="lift" d="M26.5 25.5 32 20l5.5 5.5"/>
      </g>
      <rect x="21.5" y="38" width="21" height="7.5" rx="2.5" fill="#fff"/>
      <rect x="21.5" y="30.5" width="21" height="5" rx="2" fill="#fff" fill-opacity=".55"/>
    </g>
    <text x="176" y="102" class="sans" font-size="16" font-weight="600" fill="#A0A8CE" letter-spacing="2.2">OPEN-SOURCE · GPU PLANNER FOR AGENTIC RAG</text>
    <text x="176" y="132" class="mono" font-size="15" fill="#727AA3">Next.js · Better Auth · Postgres · Vercel</text>

    <!-- wordmark + pitch -->
    <text x="60" y="262" class="disp" font-size="112" letter-spacing="3" fill="#ECEFFB">HEAD<tspan fill="url(#word)">ROOM</tspan></text>
    <text x="64" y="314" class="sans" font-size="31" font-weight="600" fill="#ECEFFB">Know your GPU headroom before you buy.</text>
    <text x="64" y="352" class="sans" font-size="19" fill="#A0A8CE">The LLM and everything around it, on one GPU budget.</text>

    <g class="sans" font-size="15" font-weight="600">
      <rect x="64" y="384" width="124" height="34" rx="17" fill="#11152B" stroke="#323A6A"/>
      <text x="126" y="406" text-anchor="middle" fill="#ECEFFB">138 LLMs</text>
      <rect x="198" y="384" width="104" height="34" rx="17" fill="#11152B" stroke="#323A6A"/>
      <text x="250" y="406" text-anchor="middle" fill="#ECEFFB">93 GPUs</text>
      <rect x="312" y="384" width="198" height="34" rx="17" fill="#11152B" stroke="#323A6A"/>
      <text x="411" y="406" text-anchor="middle" fill="#ECEFFB">175 RAG &amp; agent models</text>
      <rect x="520" y="384" width="168" height="34" rx="17" fill="#11152B" stroke="#323A6A"/>
      <text x="604" y="406" text-anchor="middle" fill="#ECEFFB">STT · TTS · OCR</text>
    </g>

    <!-- result card (real engine output: Llama 3.3 70B template, 32 users, "Full RAG + voice" stack) -->
    <g transform="translate(756 38)">
      <rect width="464" height="404" rx="22" fill="#11152B" stroke="#323A6A"/>
      <text x="24" y="40" class="sans" font-size="17" font-weight="600" fill="#ECEFFB">Llama 3.3 70B + RAG &amp; voice stack</text>
      <text x="24" y="63" class="sans" font-size="13.5" fill="#A0A8CE">4× H100 · 32 users · Whisper, BGE-M3, reranker, OCR, TTS</text>
      <g transform="translate(360 22)">
        <rect width="80" height="30" rx="15" fill="#0CA30C" fill-opacity=".16" stroke="#0CA30C" stroke-opacity=".6"/>
        <circle cx="19" cy="15" r="7" stroke="#34D399" stroke-width="2"/>
        <path d="m15.8 15 2.2 2.2 4-4.2" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="33" y="20" class="sans" font-size="13" font-weight="700" fill="#ECEFFB">Fits</text>
      </g>

      <text x="22" y="134" class="sans" font-size="62" font-weight="600" fill="#ECEFFB" letter-spacing="-2">63%</text>
      <text x="440" y="110" text-anchor="end" class="sans" font-size="22" font-weight="600" fill="#ECEFFB">170.5 <tspan font-size="14" font-weight="400" fill="#A0A8CE">GB</tspan></text>
      <text x="440" y="132" text-anchor="end" class="sans" font-size="13.5" fill="#A0A8CE">of 272.0 GB usable VRAM</text>

      <rect x="24" y="150" width="416" height="10" rx="5" fill="#0CA30C" fill-opacity=".2"/>
      <rect class="grow g1" x="24" y="150" width="262" height="10" rx="5" fill="#0CA30C"/>

      <text x="24" y="194" class="sans" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#A0A8CE">WHERE THE GPU MEMORY GOES</text>
      <rect x="24" y="206" width="416" height="8" rx="4" fill="#1C2246"/>
      <rect class="grow g2" x="24" y="206" width="90" height="8" rx="4" fill="#3987E5"/>
      <rect class="grow g3" x="116" y="206" width="104" height="8" fill="#D95926"/>
      <rect class="grow g4" x="222" y="206" width="13" height="8" fill="#199E70"/>
      <rect class="grow g5" x="237" y="206" width="15" height="8" fill="#D55181"/>
      <rect x="378" y="206" width="62" height="8" rx="4" fill="#323A6A" fill-opacity=".55"/>

      <g class="sans" font-size="13">
        <rect x="24" y="230" width="9" height="9" rx="2.5" fill="#3987E5"/><text x="41" y="239" fill="#A0A8CE">Model weights</text><text x="214" y="239" text-anchor="end" fill="#ECEFFB" font-weight="600">69.6 GB</text>
        <rect x="244" y="230" width="9" height="9" rx="2.5" fill="#D95926"/><text x="261" y="239" fill="#A0A8CE">KV cache</text><text x="440" y="239" text-anchor="end" fill="#ECEFFB" font-weight="600">80.0 GB</text>
        <rect x="24" y="252" width="9" height="9" rx="2.5" fill="#199E70"/><text x="41" y="261" fill="#A0A8CE">Runtime &amp; activations</text><text x="214" y="261" text-anchor="end" fill="#ECEFFB" font-weight="600">9.7 GB</text>
        <rect x="244" y="252" width="9" height="9" rx="2.5" fill="#D55181"/><text x="261" y="261" fill="#A0A8CE">RAG &amp; voice models</text><text x="440" y="261" text-anchor="end" fill="#ECEFFB" font-weight="600">11.2 GB</text>
        <rect x="24" y="274" width="9" height="9" rx="2.5" fill="#1C2246" stroke="#323A6A"/><text x="41" y="283" fill="#A0A8CE">Free (usable)</text><text x="214" y="283" text-anchor="end" fill="#ECEFFB" font-weight="600">101.5 GB</text>
        <rect x="244" y="274" width="9" height="9" rx="2.5" fill="#323A6A" fill-opacity=".55"/><text x="261" y="283" fill="#A0A8CE">Headroom kept</text><text x="440" y="283" text-anchor="end" fill="#ECEFFB" font-weight="600">48.0 GB</text>
      </g>

      <g class="rise r1">
        <rect x="24" y="304" width="130" height="62" rx="12" fill="#161B36" stroke="#232A50"/>
        <text x="38" y="326" class="sans" font-size="12" font-weight="600" fill="#A0A8CE">Speed per user</text>
        <text x="38" y="353" class="sans" font-size="21" font-weight="600" fill="#ECEFFB">34.9 tok/s</text>
      </g>
      <g class="rise r2">
        <rect x="167" y="304" width="130" height="62" rx="12" fill="#161B36" stroke="#232A50"/>
        <text x="181" y="326" class="sans" font-size="12" font-weight="600" fill="#A0A8CE">Ask → first word</text>
        <text x="181" y="353" class="sans" font-size="21" font-weight="600" fill="#ECEFFB">1.56 s</text>
      </g>
      <g class="rise r3">
        <rect x="310" y="304" width="130" height="62" rx="12" fill="#161B36" stroke="#232A50"/>
        <text x="324" y="326" class="sans" font-size="12" font-weight="600" fill="#A0A8CE">Per 1M tokens</text>
        <text x="324" y="353" class="sans" font-size="21" font-weight="600" fill="#ECEFFB">$6.74</text>
      </g>
      <circle class="pulse" cx="29" cy="386" r="4" fill="#34D399"/>
      <text x="40" y="390" class="sans" font-size="12.5" fill="#A0A8CE">5 RAG &amp; voice models use ≈ 13% of the GPUs' compute</text>
    </g>
  </g>
</svg>

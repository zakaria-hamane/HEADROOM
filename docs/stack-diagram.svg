<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" fill="none" role="img" aria-labelledby="t d">
  <title id="t">One question through an agentic RAG stack, sized on the same GPUs</title>
  <desc id="d">Real Headroom output for Llama 3.3 70B in FP8 with the Full RAG + voice preset on 4 H100 GPUs and 32 users. Speech-to-text, embedder, vector search, reranker, LLM and text-to-speech each show their speed and memory; document parsing and indexing run behind them. Question to first word: 2.6 ms embedding, 15 ms search, 34 ms reranking and 1.51 s LLM first token, 1.56 s in total. Everything uses 170.5 of 272.0 GB usable memory.</desc>
  <defs>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F6BFF"/><stop offset=".52" stop-color="#7B61FF"/><stop offset="1" stop-color="#FF7E51"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#323A6A" fill-opacity=".45"/></pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#1C2246"/><rect width="2.5" height="6" fill="#323A6A"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#727AA3"/></marker>
    <clipPath id="frame"><rect width="1280" height="470" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'IBM Plex Sans', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; fill: #A0A8CE; }
      .type { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
      .name { font-size: 15px; font-weight: 600; fill: #ECEFFB; }
      .metric { font-size: 12.5px; fill: #A0A8CE; }
      .box { fill: #11152B; stroke: #323A6A; }
      .flow { stroke: #727AA3; stroke-width: 1.6; }
      .ingest { stroke: #727AA3; stroke-width: 1.4; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="470" fill="#080A15"/>
    <rect width="1280" height="470" fill="url(#dots)"/>

    <!-- header -->
    <text x="58" y="44" class="sans eyebrow">EVERY QUESTION, END TO END</text>
    <text x="1222" y="44" text-anchor="end" class="sans" font-size="13" fill="#727AA3">Llama 3.3 70B + “Full RAG + voice” · 4× H100 · 32 users · 16K context</text>

    <!-- row 1: the question path -->
    <line x1="22" y1="108" x2="54" y2="108" class="flow" marker-end="url(#arrow)"/>
    <text x="22" y="96" class="sans" font-size="11" fill="#727AA3">voice</text>

    <g class="sans">
      <rect x="58" y="66" width="164" height="84" rx="14" class="box"/>
      <text x="74" y="90" class="type" fill="#9085E9">SPEECH-TO-TEXT</text>
      <text x="74" y="112" class="name">Whisper large-v3</text>
      <text x="74" y="134" class="metric">× 463 real time · 4.4 GB</text>

      <rect x="258" y="66" width="164" height="84" rx="14" class="box"/>
      <text x="274" y="90" class="type" fill="#4C8DFF">EMBEDDER</text>
      <text x="274" y="112" class="name">BGE-M3</text>
      <text x="274" y="134" class="metric">query in 3 ms · 1.8 GB</text>

      <rect x="458" y="66" width="164" height="84" rx="14" class="box" stroke-dasharray="5 4"/>
      <text x="474" y="90" class="type" fill="#A0A8CE">VECTOR SEARCH</text>
      <text x="474" y="112" class="name">Your vector DB</text>
      <text x="474" y="134" class="metric">15 ms (your setting)</text>

      <rect x="658" y="66" width="164" height="84" rx="14" class="box"/>
      <text x="674" y="90" class="type" fill="#6E8BFF">RERANKER</text>
      <text x="674" y="112" class="name">BGE Reranker v2 M3</text>
      <text x="674" y="134" class="metric">top 20 in 34 ms · 1.8 GB</text>

      <rect x="858" y="66" width="164" height="84" rx="14" fill="#141A3A" stroke="url(#llm)" stroke-width="2"/>
      <text x="874" y="90" class="type" fill="#7B9BFF">LLM</text>
      <text x="874" y="112" class="name">Llama 3.3 70B</text>
      <text x="874" y="134" class="metric">34.9 tok/s per user</text>

      <rect x="1058" y="66" width="164" height="84" rx="14" class="box"/>
      <text x="1074" y="90" class="type" fill="#FF8F66">TEXT-TO-SPEECH</text>
      <text x="1074" y="112" class="name">SILMA TTS v1</text>
      <text x="1074" y="134" class="metric">× 8.3 real time · 1.2 GB</text>
    </g>
    <line x1="222" y1="108" x2="254" y2="108" class="flow" marker-end="url(#arrow)"/>
    <line x1="422" y1="108" x2="454" y2="108" class="flow" marker-end="url(#arrow)"/>
    <line x1="622" y1="108" x2="654" y2="108" class="flow" marker-end="url(#arrow)"/>
    <line x1="822" y1="108" x2="854" y2="108" class="flow" marker-end="url(#arrow)"/>
    <line x1="1022" y1="108" x2="1054" y2="108" class="flow" marker-end="url(#arrow)"/>
    <line x1="1222" y1="108" x2="1254" y2="108" class="flow" marker-end="url(#arrow)"/>
    <text x="1226" y="96" class="sans" font-size="11" fill="#727AA3">voice</text>

    <!-- row 2: ingestion behind it -->
    <text x="58" y="190" class="sans eyebrow">AND BEHIND IT: YOUR DOCUMENTS</text>
    <g class="sans">
      <rect x="58" y="204" width="164" height="72" rx="14" fill="none" stroke="#323A6A" stroke-dasharray="5 4"/>
      <text x="74" y="230" class="type" fill="#A0A8CE">DOCUMENTS</text>
      <text x="74" y="254" class="name">10,000 pages</text>

      <rect x="258" y="204" width="164" height="72" rx="14" class="box"/>
      <text x="274" y="228" class="type" fill="#D55181">PARSER / OCR</text>
      <text x="274" y="248" class="name">Granite-Docling</text>
      <text x="274" y="267" class="metric">≈ 19,800 pages/h · 2.1 GB</text>

      <rect x="458" y="204" width="164" height="72" rx="14" class="box"/>
      <text x="474" y="228" class="type" fill="#4C8DFF">INDEXING</text>
      <text x="474" y="248" class="name">BGE-M3</text>
      <text x="474" y="267" class="metric">≈ 570 chunks/s</text>
    </g>
    <line x1="222" y1="240" x2="254" y2="240" class="ingest" marker-end="url(#arrow)"/>
    <line x1="422" y1="240" x2="454" y2="240" class="ingest" marker-end="url(#arrow)"/>
    <line x1="540" y1="204" x2="540" y2="154" class="ingest" marker-end="url(#arrow)"/>

    <!-- latency equation -->
    <g class="sans">
      <text x="658" y="190" class="eyebrow">QUESTION → FIRST WORD</text>
      <rect x="658" y="204" width="564" height="72" rx="14" fill="#0D1126" stroke="#232A50"/>
      <g class="mono" font-size="17" fill="#ECEFFB">
        <text x="680" y="238">2.6 ms</text>
        <text x="760" y="238" fill="#727AA3">+</text>
        <text x="784" y="238">15 ms</text>
        <text x="852" y="238" fill="#727AA3">+</text>
        <text x="876" y="238">34 ms</text>
        <text x="944" y="238" fill="#727AA3">+</text>
        <text x="968" y="238">1.51 s</text>
        <text x="1050" y="238" fill="#727AA3">=</text>
        <text x="1076" y="240" font-size="26" font-weight="600" class="sans" fill="#ECEFFB">1.56 s</text>
      </g>
      <g font-size="11.5" fill="#727AA3">
        <text x="680" y="260">embed</text>
        <text x="784" y="260">search</text>
        <text x="876" y="260">rerank</text>
        <text x="968" y="260">LLM first token</text>
        <text x="1076" y="260">for one prompt</text>
      </g>
    </g>

    <!-- row 3: one memory budget -->
    <text x="58" y="324" class="sans eyebrow">ALL ON THE SAME 4× H100</text>
    <text x="1222" y="324" text-anchor="end" class="sans" font-size="13" fill="#A0A8CE"><tspan fill="#ECEFFB" font-weight="600">170.5 GB</tspan> of 272.0 GB usable · <tspan fill="#34D399" font-weight="600">fits at 63%</tspan></text>
    <rect x="58" y="336" width="1164" height="14" rx="7" fill="#1C2246"/>
    <rect x="58" y="336" width="251" height="14" rx="7" fill="#3987E5"/>
    <rect x="311" y="336" width="289" height="14" fill="#D95926"/>
    <rect x="602" y="336" width="33" height="14" fill="#199E70"/>
    <rect x="637" y="336" width="39" height="14" fill="#D55181"/>
    <rect x="1047" y="336" width="175" height="14" rx="7" fill="url(#hatch)"/>

    <g class="sans" font-size="13">
      <rect x="58" y="372" width="10" height="10" rx="2.5" fill="#3987E5"/><text x="76" y="381" fill="#A0A8CE">LLM weights <tspan fill="#ECEFFB" font-weight="600">69.6 GB</tspan></text>
      <rect x="250" y="372" width="10" height="10" rx="2.5" fill="#D95926"/><text x="268" y="381" fill="#A0A8CE">KV cache, 32 users <tspan fill="#ECEFFB" font-weight="600">80.0 GB</tspan></text>
      <rect x="476" y="372" width="10" height="10" rx="2.5" fill="#199E70"/><text x="494" y="381" fill="#A0A8CE">Runtime &amp; activations <tspan fill="#ECEFFB" font-weight="600">9.7 GB</tspan></text>
      <rect x="702" y="372" width="10" height="10" rx="2.5" fill="#D55181"/><text x="720" y="381" fill="#A0A8CE">RAG &amp; voice models <tspan fill="#ECEFFB" font-weight="600">11.2 GB</tspan></text>
      <rect x="914" y="372" width="10" height="10" rx="2.5" fill="#1C2246" stroke="#323A6A"/><text x="932" y="381" fill="#A0A8CE">Free <tspan fill="#ECEFFB" font-weight="600">101.5 GB</tspan></text>
      <rect x="1052" y="372" width="10" height="10" rx="2.5" fill="url(#hatch)"/><text x="1070" y="381" fill="#A0A8CE">Kept <tspan fill="#ECEFFB" font-weight="600">48.0 GB</tspan></text>
    </g>
    <text x="58" y="420" class="sans" font-size="13" fill="#A0A8CE">The five RAG &amp; voice models use <tspan fill="#ECEFFB" font-weight="600">≈ 13% of the GPUs’ compute</tspan> at 1 question per user per minute.</text>
    <text x="58" y="446" class="sans" font-size="11.5" fill="#727AA3">Real Headroom output: Llama 3.3 70B template, FP8, 32 users, 16K context, preset “Full RAG + voice”. Planning estimates, not measurements.</text>
  </g>
</svg>

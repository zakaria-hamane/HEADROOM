name: Feature request
description: Suggest an idea for Headroom
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to decide or plan?
      description: The question you wanted Headroom to answer, and where it fell short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
